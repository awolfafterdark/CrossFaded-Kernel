name: Shusky source-lock discovery

on:
  workflow_dispatch:
  push:
    branches: [source-lock/cp3a]
    paths:
      - ".github/workflows/shusky-source-lock.yml"
      - "docs/CP3A_SOURCE_LOCK_ACTIONS.md"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Google repo tool
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync official shusky production source topology
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p provenance shusky
          df -h | tee provenance/disk-before.txt
          cd shusky
          repo init -u https://android.googlesource.com/kernel/manifest -b android-gs-shusky-6.1-android16 2>&1 | tee "$GITHUB_WORKSPACE/provenance/repo-init.log"
          init_status=${PIPESTATUS[0]}
          if [ "$init_status" -ne 0 ]; then
            echo "$init_status" > "$GITHUB_WORKSPACE/provenance/repo-init.exit"
            exit "$init_status"
          fi
          timeout --signal=TERM --kill-after=60s 35m repo sync -c --no-tags -j2 2>&1 | tee "$GITHUB_WORKSPACE/provenance/repo-sync.log"
          sync_status=${PIPESTATUS[0]}
          repo status 2>&1 | tee "$GITHUB_WORKSPACE/provenance/repo-status.log" || true
          repo manifest -r -o "$GITHUB_WORKSPACE/provenance/shusky-manifest.xml" || true
          find . -maxdepth 3 -type f \( -name 'build_*shusky*.sh' -o -name 'build_shusky.sh' \) -print | sort | tee "$GITHUB_WORKSPACE/provenance/build-entrypoints.txt" || true
          find . -maxdepth 2 -mindepth 1 -type d -printf '%P\n' | sort | tee "$GITHUB_WORKSPACE/provenance/top-level-dirs.txt" || true
          if git -C aosp rev-parse --git-dir >/dev/null 2>&1; then git -C aosp rev-parse HEAD | tee "$GITHUB_WORKSPACE/provenance/aosp-revision.txt"; fi
          df -h | tee "$GITHUB_WORKSPACE/provenance/disk-after.txt"
          echo "$sync_status" > "$GITHUB_WORKSPACE/provenance/repo-sync.exit"
          exit "$sync_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shusky-source-lock-${{ github.run_id }}
          path: provenance/
          if-no-files-found: warn
          retention-days: 14
