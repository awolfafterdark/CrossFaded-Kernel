name: Android 14-6.1 GKI compile smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gki-smoke.yml"
      - "scripts/**"
      - "target-lock/**"

permissions:
  contents: read

concurrency:
  group: gki-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: GKI aarch64 compile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MANIFEST_BRANCH: common-android14-6.1
      DIST_DIR: ${{ github.workspace }}/out/dist
    steps:
      - uses: actions/checkout@v4
      - name: Record runner and provenance
        run: |
          set -euxo pipefail
          uname -a
          df -h
          mkdir -p provenance
          printf 'repository=%s\nsha=%s\nrun_id=%s\n' "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > provenance/build-metadata.txt
      - name: Install Google repo tool
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+rx "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync hermetic Android Common Kernel source
        run: |
          set -euxo pipefail
          mkdir ack
          cd ack
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_BRANCH}"
          repo sync -c --no-tags -j2
          repo manifest -r -o "${GITHUB_WORKSPACE}/provenance/manifest.xml"
          git -C common rev-parse HEAD | tee "${GITHUB_WORKSPACE}/provenance/kernel-common-revision.txt"
      - name: Build GKI aarch64 distribution
        working-directory: ack
        run: |
          set -euxo pipefail
          tools/bazel run //common:kernel_aarch64_dist -- --destdir="${DIST_DIR}"
      - name: Inspect artifacts
        run: |
          set -euxo pipefail
          test -s "${DIST_DIR}/Image"
          find "${DIST_DIR}" -maxdepth 2 -type f -printf '%P\n' | sort | tee provenance/dist-files.txt
          sha256sum "${DIST_DIR}"/* 2>/dev/null | tee provenance/dist-sha256.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gki-smoke-${{ github.run_id }}
          path: |
            provenance/
            out/dist/
          if-no-files-found: warn
          retention-days: 7
